name: Deploy Relay demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify static demo exists
        run: test -s web/dist/index.html
      - name: Check demo JavaScript and data
        working-directory: web
        run: node test_site.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload demo only
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
